name: CI

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master, develop ]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Runs Gradle/AGP; the library still compiles to JVM 11.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # All library tests run on the JVM under Robolectric (Room's in-memory SQLite round-trip
      # included), so no emulator is needed. koverVerifyDebug enforces the coverage floor over
      # com.duck.cryptoroomdb.* (see CryptoRoomDB/build.gradle.kts).
      - name: Run tests and verify coverage
        run: ./gradlew :CryptoRoomDB:testDebugUnitTest :CryptoRoomDB:koverXmlReportDebug :CryptoRoomDB:koverVerifyDebug

      - name: Upload Kover coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: CryptoRoomDB/build/reports/kover/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: CryptoRoomDB/build/reports/tests/
          if-no-files-found: ignore
